name: סנכרון מהמשרד האחורי

on:
  # On demand: the סנכרון מחירים button in the app (through sync-relay/), or "Run workflow" on GitHub.
  # No schedule (19.11.2026): the hourly runs failed every hour and mailed Ron each time.
  workflow_dispatch:
  # And once after every change to the sync itself, so a broken sync shows up right away
  push:
    paths:
      - sync.py
      - .github/workflows/sync.yml

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright==1.48.0 pandas openpyxl
          python -m playwright install --with-deps chromium

      - name: Export from the back office and update the app
        env:
          KUPOT_USER: ${{ secrets.KUPOT_USER }}
          KUPOT_PASS: ${{ secrets.KUPOT_PASS }}
        run: python sync.py

      - name: Publish if anything changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Nothing changed."
          else
            git config user.name "Klir Market sync"
            git config user.email "sync@users.noreply.github.com"
            git add index.html
            git commit -m "סנכרון מחירים $(TZ=Asia/Jerusalem date '+%d.%m.%Y %H:%M')"
            git push
          fi

      - name: Keep a screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-failure
          path: sync-failure.png
          if-no-files-found: ignore
